services:
  - type: web
    name: studywise-ai-backend
    runtime: node
    buildCommand: npm install
    startCommand: npx tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromSecret: PORT
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      # NOTE (security): server-side AI keys are intentionally NOT duplicated as
      # VITE_* vars. Vite inlines VITE_* into the client bundle = public exposure.
      - key: OPENROUTER_API_KEY
        fromSecret: OPENROUTER_API_KEY
      - key: VITE_SUPABASE_URL
        fromSecret: VITE_SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
        fromSecret: VITE_SUPABASE_ANON_KEY
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromSecret: SUPABASE_SERVICE_ROLE_KEY
      - key: GOOGLE_OAUTH_CLIENT_ID
        fromSecret: GOOGLE_OAUTH_CLIENT_ID
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        fromSecret: GOOGLE_OAUTH_CLIENT_SECRET
